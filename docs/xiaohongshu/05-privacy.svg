<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1080" viewBox="0 0 1080 1080"><g font-family="PingFang SC,Helvetica Neue,sans-serif"><rect width="1080" height="1080" fill="#123C35"/><text x="72" y="76" fill="#A7C6B6" font-size="20" font-weight="500" >CLAUDE USAGE  /  桌面养猫计划</text><text x="1008" y="76" fill="#A7C6B6" font-size="20" font-weight="400" text-anchor="end">05 / 06</text><text x="70" y="179" fill="#F4F0E6" font-size="68" font-weight="650" >装好以后，</text><text x="70" y="269" fill="#F4F0E6" font-size="68" font-weight="650" >不用再交一遍账号。</text><text x="72" y="412" fill="#82E0B7" font-size="25" font-weight="400" >01</text><text x="156" y="418" fill="#F4F0E6" font-size="43" font-weight="600" >不读登录凭据</text><text x="156" y="473" fill="#B9D2C3" font-size="27" font-weight="400" >不用粘贴 token，也不用提供密码。</text><path d="M72 519H1008" stroke="#82E0B7" stroke-opacity=".25"/><text x="72" y="586" fill="#82E0B7" font-size="25" font-weight="400" >02</text><text x="156" y="592" fill="#F4F0E6" font-size="43" font-weight="600" >在本机读，在本机算</text><text x="156" y="647" fill="#B9D2C3" font-size="27" font-weight="400" >用量采集不联网，不上传会话记录。</text><path d="M72 693H1008" stroke="#82E0B7" stroke-opacity=".25"/><text x="72" y="760" fill="#82E0B7" font-size="25" font-weight="400" >03</text><text x="156" y="766" fill="#F4F0E6" font-size="43" font-weight="600" >代码也公开了</text><text x="156" y="821" fill="#B9D2C3" font-size="27" font-weight="400" >免费使用，MIT 开源。</text><text x="72" y="955" fill="#B9D2C3" font-size="23" font-weight="400" >数据随本地会话更新；停用后显示最后一次记录。</text><text x="72" y="1030" fill="#A7C6B6" font-size="19" font-weight="400" >macOS · Claude Code + Codex</text><text x="1008" y="1030" fill="#A7C6B6" font-size="19" font-weight="400" text-anchor="end">免费开源</text></g></svg>
